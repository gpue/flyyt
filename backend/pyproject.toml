[project]
name = "flyyt-backend"
version = "0.1.0"
description = "flyyt's VDA5050 fly-fleet simulator backend -- an alternative to vda5050-sim, same wire protocol/deploy shape, fly-scale robots"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "nats-py>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyyt_backend"]
